    <p><strong>Claudefaula</strong> és una escola de música i arts amb seu a <strong>Girona (C/ Campcardós, 39 — Santa Eugènia)</strong> i a <strong>Banyoles (Camí Can Boada, 24 — El Molí)</strong>. Oferim formació musical per a totes les edats (de 0 a 99 anys): nadons, infants, joves i adults.</p>
    <h2>Instruments i Especialitats</h2>
    <ul>
      <li>Classes de Piano i Teclats</li>
      <li>Classes de Guitarra Clàssica, Acústica i Elèctrica</li>
      <li>Classes de Cant, Tècnica Vocal i Cant Coral</li>
      <li>Classes de Bateria i Percussió</li>
      <li>Classes de Violí i Violoncel</li>

      <li>Teatre Musical, Combos de Pop-Rock i Jazz, Big Band i Improvisació</li>
    </ul>
    <h2>Cursos i Tarifes (Curs 2026–2027)</h2>

      <li><strong>Música i Moviment 1 i 2 (I4 i I5, 4-5 anys):</strong> 45 €/mes</li>
      <li><strong>Llenguatge Musical 1 a 5 (Primària i ESO):</strong> 47 €/mes</li>
